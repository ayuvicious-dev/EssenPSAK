const mtIds=()=>Object.keys(MT).filter(k=>MT[k]&&MT[k].pages&&MT[k].pages.length&&P.find(p=>p[0]==k));
const bTerms=ids=>{const m=new Map();ids.forEach(id=>MT[id]&&MT[id].pages&&MT[id].pages.forEach(pg=>pg.k.forEach(k=>{(k.t||"").replace(/<b>([^<]{3,50})<\/b>/g,(_,b)=>{b=stp(b);if(b.length>=3)m.set(b.toLowerCase(),b);return _})})));return[...m.values()]};
function genQ(pid,n){
 const ids=pid=="*"?mtIds():mtIds().filter(k=>k==pid),C=[],seen=new Set(),own=bTerms(ids),all=ids.length==mtIds().length?own:bTerms(mtIds());
 ids.forEach(id=>{const lb=P.find(p=>p[0]==id)[1];MT[id].pages.forEach(pg=>pg.k.forEach(k=>{
  if(!["p","a","i","b"].includes(k.k)||!k.t)return;
  k.t.replace(/([.!?])\s+(?=[A-Z0-9(])/g,"$1\n").split("\n").forEach(sn=>{
   const pl=stp(sn);if(pl.length<45||pl.length>300||seen.has(pl))return;
   const bs=[...sn.matchAll(/<b>([^<]{3,50})<\/b>/g)].map(m=>stp(m[1])).filter(x=>x.length>=3),src={id,lb,no:pg.no,pl},t=bs.find(x=>pl.split(x).length==2&&pl.length>x.length+30);
   if(t){seen.add(pl);C.push({ty:"t",a:t,...src});return}
   const m=pl.match(/(\d+(?:[.,]\d+)?)(\s?(?:%|persen|bulan|tahun|hari|minggu|kali|jam))(?![A-Za-z])/i);
   if(m&&!/^\d{1,3}\.\d{3}$/.test(m[1])&&pl.split(m[0]).length==2){seen.add(pl);C.push({ty:"n",a:m[0],v:m[1],u:m[2],...src})}
  })}))});
 const td=c=>{const al=c.a.toLowerCase(),pl=c.pl.toLowerCase(),ok=t=>{const l=t.toLowerCase();return l!=al&&!al.includes(l)&&!l.includes(al)&&!pl.includes(l)},pick=s=>shf(s.filter(ok)).sort((x,y)=>Math.abs(x.length-c.a.length)-Math.abs(y.length-c.a.length)).slice(0,8),o=[];
  for(const t of[...shf(pick(own)),...shf(pick(all))]){if(!o.some(z=>z.toLowerCase()==t.toLowerCase()))o.push(t);if(o.length==3)break}return o};
 const nd=c=>{const v=parseFloat(c.v.replace(",",".")),f=x=>String(+x.toFixed(2)).replace(".",","),s=new Set();[v*2,v/2,v+5,v+10,v-5,v+1,v-1,v*3,v*10].forEach(x=>{if(isFinite(x)&&x>0&&x!=v)s.add(f(x))});return shf([...s]).slice(0,3).map(x=>x+c.u)};
 const mk=c=>{const d=c.ty=="t"?td(c):nd(c);if(d.length<3)return null;const op=shf([c.a,...d]),ea=E(c.a),es=E(c.pl);
  return["Lengkapi pernyataan berikut: "+es.replace(ea,()=>"_____"),op.map(E),op.indexOf(c.a),`Jawaban: <b>${ea}</b>. ${es.replace(ea,()=>`<b>${ea}</b>`)}<br>Sumber: ${E(c.lb)}${c.no?" · "+E(c.no):""}`,c.lb]};
 const out=[];for(const c of shf(C)){const q=mk(c);if(q)out.push(q);if(out.length>=n)break}return out}
function quiz(){
if(!qs){const ids=mtIds(),op=ids.map(k=>{const x=P.find(p=>p[0]==k);return`<option value="${E(k)}"${QP.pid==k?" selected":""}>${E(x[1])} · ${E(x[2]).slice(0,48)}</option>`}).join("");
return``}
if(qs.i>=QZ.length){const rv=QG?`<h3 style="margin:18px 0 6px">Kunci jawaban</h3>`+QZ.map((q,j)=>`<div class="card" style="margin-top:8px"><div class="m">${j+1}. ${qs.h[j]==q[2]?"✓ Benar":"✗ Salah"} · ${E(q[4]||"")}</div><b>${q[0]}</b><div style="margin-top:6px">Jawaban benar: <b>${q[1][q[2]]}</b></div>${qs.h[j]!=q[2]&&q[1][qs.h[j]]!=null?`<div class="m">Jawabanmu: ${q[1][qs.h[j]]}</div>`:""}<div class="m" style="margin-top:6px">${q[3]||""}</div></div>`).join(""):"";
return`<h2>Selesai</h2><div class="card stat"><b>${qs.s}/${QZ.length}</b><span>Skor kamu</span><button class="btn" onclick="qStart()">${QG?"Ulangi soal ini":"Ulangi"}</button>${QG?`<button class="btn o" onclick="qGen()">Buat soal baru</button>`:""}<button class="btn o" onclick="qReset()">Kembali</button></div>${rv}`}
const q=QZ[qs.i];return`<h2>Soal ${qs.i+1} dari ${QZ.length}</h2>${QG?`<p class="sub" style="margin-bottom:0">${E(q[4]||"")}</p>`:""}<div class="bar" style="margin:8px 0 14px"><i style="width:${qs.i/QZ.length*100}%"></i></div><div class="card" id="qc"><b>${q[0]}</b>${q[1].map((o,i)=>`<button class="q" onclick="ans(${i})">${o}</button>`).join("")}</div>`}
window.qStart=()=>{qs={i:0,s:0,h:[]};go("q")};
window.qReset=()=>{qs=null;go("q")};
window.qBank=()=>{QZ=Q;QG=false;qStart()};
window.qGen=()=>{const pid=($("#qp")||{}).value||QP.pid,n=+(($("#qn")||{}).value||QP.n);QP={pid,n};const l=genQ(pid,n);if(!l.length){sheet(msg("Soal belum bisa dibuat","Isi materi ini belum cukup (butuh kalimat dengan istilah tebal atau angka). Coba pilih PSAK lain atau Semua materi."));return}QZ=l;QG=true;qStart()};
async function qDone(){const l={sc:qs.s,tot:QZ.length,ts:Date.now()};if(!demo)try{const r=await addDoc(path("logs"),l);l.id=r.id}catch(e){}S.logs.push(l)}
window.qNext=async()=>{qs.i++;qs.lock=0;if(qs.i>=QZ.length)await qDone();go("q")};
window.ans=async i=>{if(qs.lock)return;qs.lock=1;const q=QZ[qs.i],bs=document.querySelectorAll(".q");bs[q[2]].classList.add("r");if(i!=q[2])bs[i].classList.add("w");else qs.s++;
if(QG){qs.h[qs.i]=i;document.querySelector("#qc").insertAdjacentHTML("beforeend",`<div style="margin-top:12px;padding:10px 12px;background:var(--s);border-radius:10px;font-size:14px">${i==q[2]?"✓ Benar. ":"✗ Kurang tepat. "}${q[3]}</div><button class="btn" onclick="qNext()">${qs.i+1>=QZ.length?"Lihat hasil":"Lanjut"}</button>`);return}
await new Promise(r=>setTimeout(r,900));qs.i++;qs.lock=0;if(qs.i>=QZ.length)await qDone();go("q")};
function set(){const th=document.documentElement.dataset.theme;return`<div class="card"><label for="tm">Tampilan</label><select id="tm" onchange="setTh(this.value)"><option value="light"${th=="light"?" selected":""}>Terang</option><option value="dark"${th=="dark"?" selected":""}>Gelap</option></select><button class="btn o" onclick="out()">Keluar</button></div><p class="m" style="text-align:center;margin-top:16px">EssenPSAK v1.0</p>`}
window.setTh=v=>{document.documentElement.dataset.theme=v;localStorage.setItem("essenpsak-theme",v)};
function sheet(h){$("#sh").classList.remove("rfs");$("#sh").innerHTML=h;$("#md").classList.add("on")}function close_(){$("#md").classList.remove("on")}window.close_=close_;
$("#md").onclick=e=>{if(e.target.id=="md")close_()};
function add(){sheet(`<h2>Tambah catatan</h2><label for="np">Materi</label><select id="np">${[...new Set(P.map(x=>x[1]))].map(c=>`<option>${c}</option>`).join("")}</select><label for="nt">Judul</label><input id="nt"><label for="nb">Isi catatan</label><textarea id="nb" rows="4"></textarea><button class="btn" onclick="saveN()">Simpan catatan</button>`)}
window.saveN=async()=>{const t=$("#nt").value.trim();if(!t){$("#nt").focus();return}const n={t,b:$("#nb").value.trim(),p:$("#np").value,ts:Date.now()};if(!demo)try{const r=await addDoc(path("notes"),n);n.id=r.id}catch(e){}S.notes.unshift(n);close_();cur?det(cur,1):go(pg)};
/* ===== Zoom tabel (cubit jari / tombol +−), ukuran terakhir jadi default ===== */
let TZ=.76;try{TZ=parseFloat(localStorage.getItem("essenpsak-tz"))||.76}catch(e){}
TZ=Math.min(2.6,Math.max(.5,TZ));document.documentElement.style.setProperty("--tz",TZ);
const tzSet=v=>{TZ=Math.min(2.6,Math.max(.5,v));document.documentElement.style.setProperty("--tz",TZ);document.querySelectorAll(".tzv").forEach(e=>e.textContent=Math.round(TZ*100)+"%");try{localStorage.setItem("essenpsak-tz",TZ)}catch(e){}};
window.tzs=d=>tzSet(d==0?.76:TZ*(d>0?1.15:1/1.15));
{let pz=null;const inTw=t=>t&&t.closest&&t.closest(".tw"),dist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
document.addEventListener("touchstart",e=>{window.__mt=e.touches.length>1;const w=inTw(e.touches[0].target);window.__tw=!!(w&&w.scrollWidth>w.clientWidth+2);
 if(e.touches.length==2&&(inTw(e.touches[0].target)||inTw(e.touches[1].target)))pz={d:dist(e),z:TZ}},{passive:true});
document.addEventListener("touchmove",e=>{if(pz&&e.touches.length==2){e.preventDefault();tzSet(pz.z*dist(e)/pz.d)}},{passive:false});
document.addEventListener("touchend",e=>{if(e.touches.length<2)pz=null},{passive:true});
document.addEventListener("gesturestart",e=>{if(inTw(e.target))e.preventDefault()});
document.addEventListener("wheel",e=>{if(e.ctrlKey&&inTw(e.target)){e.preventDefault();tzSet(TZ*(e.deltaY<0?1.08:1/1.08))}},{passive:false})}
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("service-worker.js").catch(()=>{});
</script></body></html>
